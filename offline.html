<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="robots" content="noindex">
<title>You're offline – Skope Digital Academy</title>
<style>
  :root { --bg: #0b1220; --card: #111a2e; --ink: #f8fafc; --dim: #94a3b8; --cyan: #00bfff; --line: rgba(255,255,255,.08); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { min-height: 100vh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); }
  .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 32px 24px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; background: #fff; padding: 6px; }
  h1 { font-size: 1.4rem; margin: 18px 0 6px; }
  p { color: var(--dim); margin: 0 0 22px; }
  button, a.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; border: 0; border-radius: 12px;
                  background: linear-gradient(135deg, #00bfff, #0080ff); color: #fff; font: 700 1rem system-ui, sans-serif; cursor: pointer; text-decoration: none; }
  a.ghost { margin-top: 10px; background: transparent; border: 1px solid var(--line); color: var(--ink); font-weight: 600; }
  .tip { font-size: .85rem; margin: 18px 0 0; }
</style>
</head>
<body>
  <main class="card" role="main">
    <img src="assets/pwa/icon-192.png" alt="Skope Digital Academy">
    <h1>You're offline</h1>
    <p>Check your data or Wi‑Fi connection. Pages you opened recently may still work.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <a class="btn ghost" href="./">Go to the home page</a>
    <p class="tip">Your progress is saved on the server, so nothing is lost while you're offline.</p>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
